name: E2E Tests

on:
  push:
    branches:
      - master
  workflow_dispatch:  # enables manual "Run workflow" button in GitHub UI

jobs:
  test:
    # Run when triggered manually OR when commit message contains "Run the pipeline"
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'Run the pipeline')

    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install Google Chrome and ChromeDriver
        run: |
          wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

          # Install matching ChromeDriver via Chrome for Testing
          CHROME_VERSION=$(google-chrome --version | grep -oP '\d+\.\d+\.\d+\.\d+')
          CHROME_MAJOR=$(echo $CHROME_VERSION | cut -d. -f1)
          echo "Chrome version: $CHROME_VERSION (major: $CHROME_MAJOR)"

          DRIVER_URL=$(curl -s "https://googlechromelabs.github.io/chrome-for-testing/known-good-versions-with-downloads.json" \
            | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          major = '$CHROME_MAJOR'
          for v in reversed(data['versions']):
              if v['version'].split('.')[0] == major:
                  for d in v.get('downloads', {}).get('chromedriver', []):
                      if d['platform'] == 'linux64':
                          print(d['url'])
                          sys.exit(0)
          ")

          echo "ChromeDriver URL: $DRIVER_URL"
          wget -q "$DRIVER_URL" -O /tmp/chromedriver.zip
          unzip -q /tmp/chromedriver.zip -d /tmp/chromedriver_dir
          sudo mv /tmp/chromedriver_dir/chromedriver-linux64/chromedriver /usr/local/bin/chromedriver
          sudo chmod +x /usr/local/bin/chromedriver
          chromedriver --version

      - name: Write .env file from secrets
        run: |
          cat > .env << 'EOF'
          BASE_URL=${{ secrets.BASE_URL }}
          TEST_USERNAME=${{ secrets.TEST_USERNAME }}
          TEST_PASSWORD=${{ secrets.TEST_PASSWORD }}
          HEADLESS=true
          EOF

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Run E2E tests
        run: |
          dotnet test --no-build --configuration Release \
            --logger "trx;LogFileName=test-results.trx" \
            --logger "html;LogFileName=test-results.html" \
            --results-directory TestResults \
            -v normal
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          TEST_USERNAME: ${{ secrets.TEST_USERNAME }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
          HEADLESS: "true"

      - name: Test Results Summary
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Test Results Summary
          path: TestResults/test-results.trx
          reporter: dotnet-trx
          fail-on-error: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Write job summary
        if: always()
        run: |
          TRX="TestResults/test-results.trx"
          if [ ! -f "$TRX" ]; then
            echo "## Test Summary" >> $GITHUB_STEP_SUMMARY
            echo "No test results file found." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          total=$(grep -oP 'total="\K[0-9]+' "$TRX" | head -1)
          passed=$(grep -oP 'passed="\K[0-9]+' "$TRX" | head -1)
          failed=$(grep -oP 'failed="\K[0-9]+' "$TRX" | head -1)
          skipped=$(grep -oP 'notExecuted="\K[0-9]+' "$TRX" | head -1)

          total=${total:-0}
          passed=${passed:-0}
          failed=${failed:-0}
          skipped=${skipped:-0}

          echo "## Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| | Tests | Passed ✅ | Skipped ⏭️ | Failed ❌ |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Test Results Summary | ${total} ran | ${passed} passed | ${skipped} skipped | ${failed} failed |" >> $GITHUB_STEP_SUMMARY

      - name: Upload HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: html-report-${{ github.run_number }}
          path: TestResults/test-results.html
          retention-days: 14

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ github.run_number }}
          path: allure-results/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload TRX results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trx-results-${{ github.run_number }}
          path: TestResults/
          retention-days: 14
