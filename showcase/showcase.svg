<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520" width="980" height="520">
  <style>
    text{font-family:system-ui,-apple-system,Arial,sans-serif}
    .m{font-family:'Courier New',Courier,monospace}
    @keyframes f1{0%,20%,100%{opacity:0}2%,18%{opacity:1}}
    @keyframes f2{0%,20%,40%,100%{opacity:0}22%,38%{opacity:1}}
    @keyframes f3{0%,40%,60%,100%{opacity:0}42%,58%{opacity:1}}
    @keyframes f4{0%,60%,80%,100%{opacity:0}62%,78%{opacity:1}}
    @keyframes f5{0%,80%,100%{opacity:0}82%,98%{opacity:1}}
    .s1{animation:f1 5s infinite}
    .s2{animation:f2 5s infinite}
    .s3{animation:f3 5s infinite}
    .s4{animation:f4 5s infinite}
    .s5{animation:f5 5s infinite}
    @keyframes glow{0%,100%{opacity:.4}50%{opacity:.9}}
    .gl{animation:glow 2s ease-in-out infinite}
  </style>

